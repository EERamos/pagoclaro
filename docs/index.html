<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PagoClaro · Facturas</title>
  <meta name="description" content="PagoClaro paga las facturas de tu empresa dentro de tus reglas, te deja lo dudoso para revisar y explica cada decisión.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f7f7f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111720" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Inter and Geist Mono: the two families blinka.co self-hosts, here from Google Fonts. -->
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400..500&family=Inter:wght@400..650&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Saltar al contenido</a>

  <header class="top">
    <div class="top-in">
      <a class="brand" href="#facturas">
        <svg viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" style="fill: var(--accent)"/><path d="M10.5 20.5v-13h5a4.25 4.25 0 0 1 0 8.5h-5" style="fill: none; stroke: var(--on-accent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>PagoClaro</span>
      </a>
      <nav class="nav" aria-label="Secciones" data-i18n-aria="navLabel">
        <a href="#facturas" data-view="facturas"><span data-i18n="navInvoices">Facturas</span><span class="nav-count" id="navCount" hidden></span></a>
        <a href="#proveedores" data-view="proveedores" aria-label="Proveedores autorizados" data-i18n-aria="navVendors"><span class="nav-long" data-i18n="navVendors">Proveedores autorizados</span><span class="nav-short" data-i18n="navVendorsShort">Proveedores</span></a>
        <a href="#ajustes" data-view="ajustes" data-i18n="navSettings">Ajustes</a>
        <a href="#historial" data-view="historial" data-i18n="navHistory">Historial</a>
      </nav>
      <div class="who" id="who">
        <label><span data-i18n="yourName">Tu nombre</span><input id="actor" autocomplete="name" maxlength="60" spellcheck="false"></label>
        <label><span data-i18n="accessCode">Código de acceso</span><input id="accessCode" type="password" autocomplete="off" maxlength="80"></label>
      </div>
      <button class="lang" id="langBtn" type="button" lang="en" aria-label="Switch to English">EN</button>
    </div>
  </header>

  <div class="notice" id="staticNotice" hidden></div>

  <main id="main" tabindex="-1">
    <section class="view" id="view-facturas" aria-labelledby="h-facturas">
      <h2 class="sr" id="h-facturas" tabindex="-1" data-i18n="navInvoices">Facturas</h2>
      <div class="alerts" id="alerts" role="status"></div>
      <div class="summary sheet" id="summary"></div>
      <section class="insights sheet" id="insights" aria-labelledby="ins-h" hidden></section>
      <div class="desk">
        <div class="inbox sheet">
          <form class="drop" id="drop">
            <input type="file" id="file" accept=".pdf,.png,.jpg,.jpeg,.eml,.txt" hidden>
            <button class="btn primary small" type="button" id="pickBtn" data-i18n="upload">Subir factura</button>
            <span class="hint" id="uploadHint" data-i18n="uploadHint">o arrástrala aquí. PDF, foto, correo o chat, hasta 10 MB.</span>
          </form>
          <div class="facet" id="facet" hidden></div>
          <ul class="rows" id="rows" aria-label="Facturas" data-i18n-aria="navInvoices"></ul>
        </div>
        <article class="detail sheet" id="detail" tabindex="-1"></article>
      </div>
      <p class="sr" id="announce" aria-live="polite"></p>
    </section>
    <section class="view" id="view-proveedores" aria-labelledby="h-proveedores" hidden></section>
    <section class="view" id="view-ajustes" aria-labelledby="h-ajustes" hidden></section>
    <section class="view" id="view-historial" aria-labelledby="h-historial" hidden></section>
  </main>

  <footer class="foot">
    <p><span data-i18n="footMade">Hecho para el reto Blinka del Hackathon 30X</span><span data-i18n="footSim">Los pagos son simulados: no se mueve dinero real.</span></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js" defer></script>
</body>
</html>
